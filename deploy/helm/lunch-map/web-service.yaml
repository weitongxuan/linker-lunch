apiVersion: v1
kind: Service
metadata:
  name: {{ include "lunch-map.webName" . }}
  labels:
    {{- include "lunch-map.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "lunch-map.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
