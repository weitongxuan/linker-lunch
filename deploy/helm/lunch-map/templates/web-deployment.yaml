apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunch-map.webName" . }}
  labels:
    {{- include "lunch-map.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "lunch-map.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "lunch-map.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            # nginx 把 /api、/photos proxy 到叢集內的 api service —— 前端跟 api
            # 對瀏覽器來說是同源,完全不用處理 CORS。
            - name: API_UPSTREAM
              value: "http://{{ include "lunch-map.apiName" . }}:{{ .Values.api.port }}"
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
