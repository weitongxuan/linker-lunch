apiVersion: v1
kind: Service
metadata:
  name: {{ include "lunch-map.apiName" . }}
  labels:
    {{- include "lunch-map.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "lunch-map.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
