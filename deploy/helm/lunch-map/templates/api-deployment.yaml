apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunch-map.apiName" . }}
  labels:
    {{- include "lunch-map.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # SQLite 是單一寫入者:固定 1 個 replica,而且用 Recreate(不是 RollingUpdate)——
  # 不然滾動升級時新舊兩個 pod 會同時掛同一個 RWO volume。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lunch-map.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "lunch-map.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              value: "file:/app/apps/api/data/lunch.db"
            - name: PHOTOS_DIR
              value: "/app/apps/api/data/photos"
            - name: CORS_ORIGIN
              value: {{ .Values.api.env.corsOrigin | quote }}
            - name: MARKET_CRON_ENABLED
              value: {{ .Values.api.env.marketCronEnabled | quote }}
          volumeMounts:
            - name: data
              mountPath: /app/apps/api/data
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lunch-map.apiName" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
