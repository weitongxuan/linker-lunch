<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}</style></head><body>
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蓬萊路午餐地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ==========================================================================
   午餐地圖 — 設計系統

   主題：午休是一個「時間」問題,不是「距離」問題。
         所以版面的主角是每張卡片上那條午休時間軸,
         其餘一律壓低,讓「幾點出門、吃得到幾分鐘」一眼可讀。

   Tokens 的三種主題狀態都要顧到:
     :root                                       -> 淺色（未標記時的預設）
     @media(dark) :root:not([data-theme=light])   -> 系統深色
     :root[data-theme=dark]                       -> 使用者明確選深色
   顏色只在 token 層定義,元件一律走 var()。
   ========================================================================== */
:root{
  --bg:#f2f4f7; --card:#ffffff; --soft:#f7f9fb; --line:#e3e7ec; --line2:#eef1f5;
  --ink:#171d26; --ink2:#3f4a58; --dim:#6b7684;
  --tagbg:#eef1f5; --noteBg:#f7f9fb; --trackbg:#e9edf2; --openband:#cfd8e2;
  --accent:#1b4dd8; --accentbg:#e8eeff; --accentline:#c3d3fa; --pickbg:#eef4ff;
  --ok:#15653a;    --okbg:#dcf5e6;   --okbar:#1f9d57;
  --tight:#94500a; --tightbg:#fdefd6; --tightbar:#d98324;
  --no:#4c5865;    --nobg:#e4e9ee;   --nobar:#93a0ad;
  --closed:#a8261f;--closedbg:#fbe6e4;--closedbar:#cf4a41;
  --park:#65319f;  --parkbg:#f1e9fb;  --drink:#0d7a72; --dessert:#b03060;
  --warnbg:#fff5e9; --warnink:#8a3d10; --warnline:#f6cfa4;
  --star:#a2730a;  --stardim:#ccd2d9;
  --mask:rgba(16,22,30,.5); --toast:#171d26; --toastink:#ffffff;
  --tiles:none;
  --shadow:0 1px 2px rgba(16,22,30,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1319; --card:#171d26; --soft:#1c232e; --line:#28313d; --line2:#212934;
    --ink:#e7ebf1; --ink2:#b6bfcb; --dim:#8b96a4;
    --tagbg:#222a36; --noteBg:#1a212b; --trackbg:#1c242f; --openband:#33404f;
    --accent:#84a8ff; --accentbg:#1a2540; --accentline:#31456f; --pickbg:#161f33;
    --ok:#6cd394;    --okbg:#122c1e;   --okbar:#39a86a;
    --tight:#ecb26a; --tightbg:#33240f; --tightbar:#c9822c;
    --no:#9aa6b4;    --nobg:#222a36;   --nobar:#5c6875;
    --closed:#f39189;--closedbg:#351a17;--closedbar:#b8534b;
    --park:#bb9df7;  --parkbg:#251b3b;  --drink:#4fd0c4; --dessert:#f08ab0; --dessert:#f08ab0;  --drink:#4fd0c4;
    --warnbg:#2a1e12; --warnink:#eab588; --warnline:#46331d;
    --star:#e8ae35;  --stardim:#333c48;
    --mask:rgba(4,7,11,.64); --toast:#e7ebf1; --toastink:#0f1319;
    --tiles:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.65);
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1319; --card:#171d26; --soft:#1c232e; --line:#28313d; --line2:#212934;
  --ink:#e7ebf1; --ink2:#b6bfcb; --dim:#8b96a4;
  --tagbg:#222a36; --noteBg:#1a212b; --trackbg:#1c242f; --openband:#33404f;
  --accent:#84a8ff; --accentbg:#1a2540; --accentline:#31456f; --pickbg:#161f33;
  --ok:#6cd394;    --okbg:#122c1e;   --okbar:#39a86a;
  --tight:#ecb26a; --tightbg:#33240f; --tightbar:#c9822c;
  --no:#9aa6b4;    --nobg:#222a36;   --nobar:#5c6875;
  --closed:#f39189;--closedbg:#351a17;--closedbar:#b8534b;
  --park:#bb9df7;  --parkbg:#251b3b;
  --warnbg:#2a1e12; --warnink:#eab588; --warnline:#46331d;
  --star:#e8ae35;  --stardim:#333c48;
  --mask:rgba(4,7,11,.64); --toast:#e7ebf1; --toastink:#0f1319;
  --tiles:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.65);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:13px/1.6 "Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;
  display:flex; flex-direction:column;
}
button,select,input,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono,.clock,.plan,.hrs,.sv,.track-cap,.votebox b,.sum b{
  font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
code{font:12px "IBM Plex Mono",ui-monospace,Consolas,monospace;
     background:var(--tagbg);padding:1px 5px;border-radius:4px}

/* ---------------- 頂部 ---------------- */
header{background:var(--card);border-bottom:1px solid var(--line);padding:11px 16px 0;flex:0 0 auto}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.where{font-size:11px;color:var(--dim);letter-spacing:.04em}
.clock{font-size:11px;color:var(--dim);margin-left:auto}
.me{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.me input{border:1px solid var(--line);background:var(--soft);border-radius:6px;
          padding:3px 8px;width:86px;font-size:12px}

.tabs{display:flex;gap:3px;margin-top:11px}
.tab{border:1px solid var(--line);border-bottom:none;background:var(--soft);
     padding:8px 0;border-radius:9px 9px 0 0;font-size:13px;color:var(--dim);
     flex:1 1 0;min-width:0;position:relative}
.tab.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--accent)}
.tab .td{display:block;font-size:9px;color:var(--accent);font-weight:700;letter-spacing:.1em}

/* ---------------- 主工具列 ---------------- */
.bar1{background:var(--card);border-bottom:1px solid var(--line);padding:9px 16px;
      display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.plan{font-size:11px;color:var(--accent);background:var(--accentbg);
      padding:3px 9px;border-radius:99px;font-weight:600;white-space:nowrap}
.spacer{flex:1}
.mkt{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;
     border:1px solid transparent;cursor:help}
.mkt.up{color:var(--closed);background:var(--closedbg)}     /* 台股習慣：漲=紅 */
.mkt.down{color:var(--ok);background:var(--okbg)}           /* 跌=綠 */
.mkt.flat{color:var(--dim);background:var(--tagbg)}
.mkt.off{color:var(--dim);background:transparent;border-color:var(--line)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--soft);padding:5px 11px;font-size:12px;color:var(--dim);
            border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:8px;
     padding:5px 11px;font-size:12px;color:var(--ink2)}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{background:var(--warnbg);border-color:var(--warnline);color:var(--tight)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim);padding:3px 6px}
.btn.ghost:hover{background:var(--tagbg);border-color:transparent;color:var(--ink2)}
#fcount:empty{display:none}
#fcount{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:99px;
        background:var(--accent);color:#fff;font-size:10px;font-weight:700;text-align:center}
#btnFilter.pri #fcount{background:rgba(255,255,255,.28)}

/* ---------------- 篩選抽屜 ---------------- */
.drawer{background:var(--soft);border-bottom:1px solid var(--line);
        padding:11px 16px;display:flex;flex-direction:column;gap:9px;flex:0 0 auto}
.drawer[hidden]{display:none}
.crow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lbl{font-size:10px;color:var(--dim);min-width:46px;font-weight:700;letter-spacing:.1em}
.lbl.auto{min-width:auto;margin-left:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;
      padding:4px 11px;font-size:12px;color:var(--dim)}
.chip:hover{border-color:var(--dim)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.hint{font-size:11px;color:var(--dim)}

/* ---------------- 提示條 ---------------- */
.banner{margin:0;padding:8px 16px;font-size:11.5px;line-height:1.55;
        border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
.banner .bx{flex:1}
.banner .bclose{border:none;background:transparent;color:inherit;opacity:.55;
                font-size:14px;line-height:1;padding:0 2px;flex:0 0 auto}
.banner .bclose:hover{opacity:1}
.banner.sample{background:var(--warnbg);color:var(--warnink)}
.banner.err{background:var(--closedbg);color:var(--closed)}

/* ---------------- 隨機推薦 ---------------- */
#pick{padding:0 16px}
.pickcard{background:var(--pickbg);border:1px solid var(--accentline);border-radius:13px;
          padding:13px 15px;margin:11px 0 0;display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.pickcard .who{font-size:21px;font-weight:800;letter-spacing:-.01em;text-wrap:balance;line-height:1.25}
.pickcard .sub{font-size:11.5px;color:var(--dim)}
.pickcard .eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--accent)}

/* ---------------- 版面 ---------------- */
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(370px,1fr) 1fr}
main.list-only,main.map-only{grid-template-columns:1fr}
main.list-only #mapwrap,main.map-only #listwrap{display:none}
#listwrap{overflow-y:auto;padding:12px 16px 48px;min-height:0}
main.list-only #listwrap>*{max-width:760px;margin-left:auto;margin-right:auto}
#mapwrap{position:relative;border-left:1px solid var(--line);min-height:0}
#map{position:absolute;inset:0;background:var(--bg)}
#mapmsg{position:absolute;inset:0;display:none;place-items:center;text-align:center;
        padding:24px;color:var(--dim);font-size:12.5px;background:var(--bg)}
@media(max-width:880px){
  main{grid-template-columns:1fr}
  main:not(.map-only) #mapwrap{display:none}
  main.map-only #listwrap{display:none}
  .tab{padding:7px 4px;font-size:12px}
}

/* ---------------- 摘要 ---------------- */
.sum{font-size:11.5px;color:var(--dim);margin:0 0 10px;display:flex;gap:8px;
     align-items:baseline;flex-wrap:wrap}
.sum b{color:var(--ink);font-weight:700}
.sum .dot{opacity:.4}
.sum .warn{color:var(--tight)}

/* ---------------- 店家卡 ---------------- */
.shop{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:10px 13px 10px 15px;margin-bottom:8px;position:relative;
      box-shadow:var(--shadow);transition:border-color .12s}
.shop.dim{opacity:.72;box-shadow:none;background:var(--soft)}
.shop.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.shop .bar{position:absolute;left:0;top:0;bottom:0;width:4px;
           border-radius:12px 0 0 12px}
.shop .top{display:flex;gap:10px;align-items:baseline}
.nm{font-size:16px;font-weight:700;flex:1;min-width:0;letter-spacing:-.01em;
    line-height:1.35;text-wrap:balance}
.nm .sp{font-size:9.5px;font-weight:700;color:var(--warnink);background:var(--warnbg);
        border:1px solid var(--warnline);border-radius:4px;padding:1px 5px;
        margin-left:7px;vertical-align:2px;letter-spacing:.04em;white-space:nowrap}
.st{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap;flex:0 0 auto}
.st.ok{color:var(--ok);background:var(--okbg)}
.st.tight{color:var(--tight);background:var(--tightbg)}
.st.no{color:var(--no);background:var(--nobg)}
.st.closed{color:var(--closed);background:var(--closedbg)}
/* 未知用虛線框,和「確定的狀態」在視覺上就分開 */
.st.unk{color:var(--dim);background:transparent;border:1px dashed var(--line);padding:2px 9px}

/* 骨幹：一行講完交通、類別、價位、評分 */
.spine{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-top:4px;
       font-size:12px;color:var(--dim)}
.spine .sv{color:var(--accent);font-weight:600;font-size:12px}
.spine .sc{color:var(--star);font-weight:700}
.mthumb{width:44px;height:44px;object-fit:cover;border-radius:7px;cursor:pointer;
        border:1px solid var(--line)}
.mthumb:hover{border-color:var(--accent)}
.mthumbw{position:relative;display:inline-flex}
/* 共享的照片標一下,免得以為別人也看得到自己那張 */
.mthumbw.sh::after{content:'👥';position:absolute;right:-3px;bottom:-4px;font-size:10px;
                   background:var(--card);border-radius:4px;padding:0 1px;line-height:1.1}
.spine .mn{color:var(--drink);background:var(--tagbg);border-radius:5px;
           padding:1px 6px;font-size:11px;font-weight:600;cursor:help}
.spine .gr{color:var(--dim);background:var(--tagbg);border-radius:5px;
           padding:1px 6px;font-size:11px;font-weight:600;cursor:help}
.spine .dot{opacity:.4}

/* 午休時間軸 —— 這張卡片的主角 */
.tl{display:flex;align-items:center;gap:7px;margin-top:8px}
.track-cap{font-size:9.5px;color:var(--dim);flex:0 0 auto;letter-spacing:.02em}
.track{position:relative;flex:1 1 auto;height:10px;border-radius:99px;
       background:var(--trackbg);overflow:hidden}
.track i{position:absolute;top:0;bottom:0;display:block}
.tb-open{background:var(--openband)}
.tb-unknown{background:repeating-linear-gradient(90deg,
            var(--openband) 0 3px,transparent 3px 8px)}
.tb-go,.tb-back{background:repeating-linear-gradient(45deg,
                var(--line) 0 2px,transparent 2px 5px)}
.tb-wait{background:var(--tightbg)}
.tb-eat{border-radius:99px}
.tb-peak{background:repeating-linear-gradient(45deg,
         var(--warnline) 0 2px,transparent 2px 4px)}
.track u{position:absolute;top:0;bottom:0;width:1px;background:var(--card);opacity:.75}

.why{font-size:12px;color:var(--ink2);margin-top:7px;line-height:1.5}
.why b{color:var(--ink);font-weight:700;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
.why .mono{font-weight:700}
.why .flag{color:var(--tight)}

.spine .tgs{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:3px}
.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10.5px;color:var(--dim);background:var(--tagbg);border-radius:5px;
     padding:2px 7px;letter-spacing:.01em}
.tag.pk{color:var(--park);background:var(--parkbg)}
.tag.peak{color:var(--warnink);background:var(--warnbg)}
.tag.ate{color:var(--warnink);background:var(--warnbg)}
.tag.rep{color:var(--closed);background:var(--closedbg);font-weight:700}
#rcount:empty{display:none}
#rcount{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:99px;
        background:var(--closed);color:var(--card);font-size:10px;font-weight:700;text-align:center}
.mynote{font-size:12px;margin-top:7px;padding:6px 9px;background:var(--noteBg);
        border-left:2px solid var(--accentline);border-radius:0 6px 6px 0;
        white-space:pre-wrap;color:var(--ink2)}

.acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;align-items:center;
      padding-top:7px;border-top:1px solid var(--line2)}
.acts .btn{padding:3px 9px;font-size:11px}
.stars{display:inline-flex;gap:1px;margin-right:4px}
.stars b{cursor:pointer;color:var(--stardim);font-size:15px;line-height:1;
         transition:transform .1s}
.stars b:hover{transform:scale(1.15)}
.stars b.f{color:var(--star)}
.votebox{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
         border-radius:8px;padding:2px 6px;font-size:11px}
.votebox b{min-width:13px;text-align:center;color:var(--ink)}

.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.hrs{font-size:11.5px;display:grid;grid-template-columns:42px 1fr;gap:3px 10px}
.hrs .d{color:var(--dim)}
.hrs .today{font-weight:700;color:var(--accent)}
.detail .why{margin-top:9px}
.detail textarea{width:100%;min-height:56px;border:1px solid var(--line);background:var(--soft);
                 border-radius:8px;padding:7px 9px;margin-top:9px;resize:vertical;font-size:12px}
.who-rated{font-size:11px;color:var(--dim);margin-top:8px}
.who-rated s{text-decoration:none;color:var(--ink2);margin-right:9px;white-space:nowrap}


/* ---------------- 吃飽再買（飲料 / 咖啡）---------------- */
.dhead{display:flex;align-items:baseline;gap:9px;margin:18px 0 8px;
       padding-top:14px;border-top:1px solid var(--line)}
.dtitle{font-size:14px;font-weight:700;letter-spacing:-.01em}
.dsub{font-size:11px;color:var(--dim)}
.dsub b{color:var(--ink)}
.dhead .btn{margin-left:auto}
.drow{display:grid;grid-template-columns:1fr auto;gap:2px 9px;align-items:baseline;
      background:var(--card);border:1px solid var(--line);border-radius:9px;
      padding:8px 11px;margin-bottom:6px}
.drow.dim{opacity:.62;background:var(--soft)}
.dn{font-size:13.5px;font-weight:700;min-width:0}
.dst{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;
     white-space:nowrap;justify-self:end}
.dst.open{color:var(--drink);background:var(--okbg)}
.dst.later{color:var(--tight);background:var(--tightbg)}
.dst.closed{color:var(--no);background:var(--nobg)}
.dst.unknown{color:var(--dim);background:transparent;border:1px dashed var(--line);padding:1px 7px}
.dmeta{font-size:11.5px;color:var(--dim);grid-column:1}
.dstars{grid-column:2;justify-self:end}
.dstars b{font-size:13px}

/* ---------------- 對話框 ---------------- */
.mask{position:fixed;inset:0;background:var(--mask);display:none;place-items:center;
      padding:20px;z-index:9999}
.mask.on{display:grid}
.modal{background:var(--card);border:1px solid var(--line);border-radius:15px;max-width:780px;
       width:100%;max-height:88vh;overflow:auto;padding:17px 19px}
.modal h2{font-size:16px;margin:0 0 9px;letter-spacing:-.01em}
.modal p{font-size:12px;color:var(--ink2);margin:7px 0;line-height:1.65}
.modal textarea{width:100%;height:300px;border:1px solid var(--line);background:var(--soft);
                border-radius:9px;padding:10px;
                font:11.5px/1.55 "IBM Plex Mono",ui-monospace,Consolas,monospace}

/* ---------------- Leaflet 跟著主題 ---------------- */
.leaflet-tile-pane{filter:var(--tiles)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-popup-content-wrapper{border-radius:11px}
.leaflet-popup-content{font:12.5px/1.55 "Noto Sans TC","Microsoft JhengHei",sans-serif}
.leaflet-popup-content b{font-size:13.5px}
.leaflet-container{background:var(--bg)}
.leaflet-bar a{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--soft)}
.leaflet-control-attribution{background:var(--card)!important;color:var(--dim)}
.leaflet-control-attribution a{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ==========================================================================
   手機版覆寫 —— 一定要放在樣式表最後面。
   （第一次寫在中間，被後面的 .stars b / .me input 蓋掉，實測才發現。）
   ========================================================================== */
/* ---------------- 手機 ----------------
   桌機是「頂部固定 + 清單內部滾動」的兩欄版面；手機上那樣會用掉
   490px（實測）在還沒看到任何一家店之前。所以手機改成整頁滾動，
   頂部捲得掉，只留星期分頁釘在上面。
   ------------------------------------ */
@media(max-width:600px){
  /* 整頁滾動 */
  html,body{height:auto}
  body{display:block}
  main{display:block}
  #listwrap{overflow:visible;min-height:0;padding:10px 12px 64px}
  main.list-only #listwrap>*{max-width:none}

  /* 星期分頁釘住 —— 捲到清單中間還是要能換天 */
  header{padding:9px 12px 0}
  /* 黏整個 header，負的 top 由 stickyTabs() 量出來寫進 style。
     只黏 .tabs 沒用 —— sticky 跑不出父層的框。 */
  header{position:sticky;z-index:20}
  .tabs{margin-top:9px;background:var(--card);box-shadow:0 1px 0 var(--line)}
  h1{font-size:17px}
  /* 時鐘和「你是」擠同一行就好，各佔一行會讓 header 多 40px */
  .clock{font-size:10.5px}
  .hrow{gap:7px}

  /* 點擊目標：手指最小 44px。桌機的 25px 高按鈕在手機上按不到 */
  /* 純靠字級長不出方形觸控區,所以固定 42×42 */
  .stars{gap:0}
  .stars b{display:inline-block;width:42px;height:42px;line-height:42px;
           text-align:center;font-size:25px;padding:0}
  .acts{gap:6px}
  .acts .btn{min-height:42px;padding:9px 13px;font-size:12.5px}
  /* 工具列改單行橫向滑動：換行會把它撐成三排（實測 124px）。
     這是容器自己滑，不是整頁橫向溢出。 */
  .bar1{padding:8px 12px;gap:6px;flex-wrap:nowrap;overflow-x:auto;
        scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .bar1::-webkit-scrollbar{display:none}
  .bar1>*{flex:0 0 auto}
  .bar1 .spacer{display:none}
  .bar1 .btn,.drawer .btn,.chip{min-height:42px;padding:9px 13px}
  .seg button{min-height:42px;padding:9px 13px}
  .tab{min-height:46px;padding:9px 4px}
  .dstars b{display:inline-block;width:38px;height:40px;line-height:40px;
            text-align:center;font-size:23px;padding:0}

  /* iOS 會把字級 <16px 的輸入框放大整頁,而且不會縮回去 */
  /* iOS 會把字級 <16px 的輸入框放大整頁,而且不會縮回去。
     這三條要用跟原本一樣的選擇器,權重才蓋得過去。 */
  input,textarea,select{font-size:16px}
  .me input{width:104px;font-size:16px;padding:6px 9px}
  .detail textarea{font-size:16px}
  /* #sortSel 掛的是 .btn（0,1,0），element 選擇器蓋不過去 —— 要 select.btn */
  select.btn{font-size:16px}
  .modal textarea{font-size:13px}

  /* 提示條預設收成 3 行,點一下展開（三條加起來 228px,比內容還高）*/
  /* 收成 1 行。三條提示加起來原本 190px 以上，開 app 第一眼會看不到店。 */
  .banner{max-height:calc(1.55em + 17px);overflow:hidden;cursor:pointer;
          position:relative;padding-right:52px}
  .banner.exp{max-height:none}
  .banner.clip::after{content:'⌄ 點開';position:absolute;right:8px;bottom:2px;
          font-size:10px;font-weight:700;opacity:.75;
          background:inherit;padding-left:8px}
  .banner.exp.clip::after{content:'⌃ 收起'}

  /* 對話框：手機上滿版比較好按 */
  .mask{padding:8px}
  .modal{padding:14px;border-radius:13px;max-height:92vh}
  .modal textarea{height:38vh}
  .detail textarea{min-height:76px}
  .mthumb{width:56px;height:56px}

  /* 卡片：左右邊距縮一點,字大一點 */
  .shop{padding:11px 12px 11px 14px}
  .nm{font-size:16.5px}
  .why{font-size:12.5px}
}

/* 很窄的機型（iPhone SE 等）*/
@media(max-width:360px){
  .tab{font-size:11px}
  h1{font-size:16px}
  .bar1 .btn,.chip,.seg button{padding:9px 10px;font-size:11.5px}
  /* 只有一個 emoji 的鈕（🚩）在窄螢幕會縮到 37px，補最小寬 */
  .bar1 .btn{min-width:42px}
}

<script>
/* ==== 內嵌自 shops.js（由 build-shared.py 產生，勿直接改這裡）==== */
/* ============================================================
   午餐地圖 — 資料檔
   ------------------------------------------------------------
   店名與座標來自 OpenStreetMap（Overpass API,2026-08-21 抓取）,
   收錄範圍 = 鼓山 → 鹽埕（Overpass 1.8 km 半徑）,
   對應 config.maxDriveMin = 15。

   ⚠️ 營業時間只有 OSM 上有標、而且能解析的才填進去。
      其餘標 hoursUnknown: true,畫面上顯示「營業時間未知」——
      不會被當成公休,也不會算進「吃得到」或被隨機抽中。
      你確認過某家的時間之後：把時段填進 hours、刪掉 hoursUnknown,
      那家就會納入判斷。

   ⚠️ 價位一律是 null（OSM 沒有這個欄位,不猜）。自己填 1~4:
        1 = 100 以下   2 = 100–200   3 = 200–500   4 = 500–1000（一人）

   營業時間一定要用結構化寫法,不要寫成字串:
     hours: {
       mon: [["11:00","14:00"], ["17:00","21:00"]],   // 一天可以兩個時段
       wed: [],                                        // 空陣列 = 固定公休
       ...
     }
   時段跨夜可以寫 [["18:00","01:00"]],程式會自動處理。

   service:  "dine_in"(內用) / "takeout"(外帶) / "delivery"(外送)
   category: 麵 / 飯 / 便當 / 自助餐 / 素食 / 水餃 / 早餐 / 火鍋 /
             牛排 / 海鮮 / 速食 / 小吃 / 其他
   walkMin / driveMin: 留空的話程式用經緯度推算。實測過填進去更準。
   peak:     { from:"12:00", to:"12:40", note:"12:00 一定排隊" }

   開車時間怎麼算：
     開到停車場 + 找車位 + 從停車場走到店。
     所以 parkings 填得越準,開車時間越可信;完全不填也能跑,
     會退回「直達 + 路邊找位 streetSearch 分」。
     嘟嘟房這類 OSM 上常常沒有,自己補一筆最準。

   desserts（甜點）與 drinks（飲料）的判斷邏輯跟餐廳不同：
     它們問的是「現在這個時間有沒有開」,不是「午餐時段吃不吃得到」——
     因為你是吃完飯才去買的。
   ============================================================ */

window.LUNCH_DATA = {

  config: {
    // 辦公室座標 = 高雄市鼓山區蓬萊路 23 號(哈瑪星／駁二蓬萊倉庫一帶)
    office: { lat: 22.6208, lng: 120.2772, name: "蓬萊路 23 號" },

    // 出門時間。start 與 end 相同 = 單一出門時刻。
    // 想改回一個區間（例如 11:30–11:50）就把兩個值填不一樣。
    depart: { start: "11:40", end: "11:40" },
    backBy: "13:00",     // 內部用來算可用餐窗,畫面上不顯示

    // 坐下來到吃完至少需要的分鐘（含點餐、等餐）

<script>
/* ==========================================================================
   0. 設定
   ========================================================================== */
const DEF = {
  office:{lat:22.6208,lng:120.2772,name:"辦公室"},
  depart:{start:"11:30",end:"11:50"}, backBy:"13:00", eatMinutes:25,
  walkSpeed:80, detour:1.25, maxWalkMin:10,
  driveSpeed:400, parkSearch:3, streetSearch:6, driveWorthIt:5, maxDriveMin:10,
  priceBands:[{v:1,label:'$'},{v:2,label:'$$'},{v:3,label:'$$$'},{v:4,label:'$$$$'}]
};
const DATA  = window.LUNCH_DATA || {};
const CFG   = Object.assign({}, DEF, DATA.config || {});
const SHOPS = (DATA.shops || []).slice();
const PARKS  = (DATA.parkings || []).slice();
const DRINKS   = (DATA.drinks   || []).slice();   // 吃飽再買:茶飲與咖啡
const DESSERTS = (DATA.desserts || []).slice();   // 吃飽再吃:冰品/豆花/甜點
/* 這兩區跟餐廳的問題不同：你已經吃完了,問的是「現在哪裡有開」。 */
const AFTER = [
  {key:'desserts', title:'吃飽再吃', sub:'冰品 / 豆花 / 甜點', arr:DESSERTS, tok:'--dessert'},
  {key:'drinks',   title:'吃飽再買', sub:'茶飲 / 咖啡',        arr:DRINKS,   tok:'--drink'}
];

const ORDER = ['mon','tue','wed','thu','fri','sat','sun'];
const JS2KEY= ['sun','mon','tue','wed','thu','fri','sat'];
const LABEL = {mon:'週一',tue:'週二',wed:'週三',thu:'週四',fri:'週五',sat:'週六',sun:'週日'};
const TABS  = ['mon','tue','wed','thu','fri'];
const SRV   = {dine_in:'內用',takeout:'外帶',delivery:'外送'};
const TIER  = {w5:'走路 5 分內', w10:'走路 '+(CFG.maxWalkMin)+' 分內',
               d10:'開車 '+(CFG.maxDriveMin)+' 分內'};

/* ==========================================================================
   1. 時間工具
   ========================================================================== */
const toMin = s => { const p=String(s).split(':').map(Number); return p[0]*60+(p[1]||0); };
const fmt   = m => { m=((Math.round(m)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const dstr  = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => dstr(new Date());
const nowMin= () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const todayKey = () => JS2KEY[new Date().getDay()];

/* ==========================================================================
   2. 距離 → 走路 / 開車（開車含「停哪裡」）
   ========================================================================== */
function haversine(a,b){
  const R=6371000, rad=x=>x*Math.PI/180;
  const dLa=rad(b.lat-a.lat), dLn=rad(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const walkMinFor = meters => Math.max(1, Math.ceil(meters*CFG.detour/CFG.walkSpeed));

/* 開車時間 = 開到停車場 + 找車位 + 從停車場走到店。
   候選包含每一座登記的停車場,以及「不進停車場、直接找路邊車位」。
   路邊停用 streetSearch（預設 6 分,午休時段本來就難找）,
   不是「停在店門口 3 分鐘搞定」—— 否則 parkings 資料永遠不會被選中。
   店家自己有停車場時填 ownParking: true。 */
function driveVia(shop){
  if(shop.driveMin != null) return {min:shop.driveMin, park:null, parkWalk:0};
  const driveMin = m => Math.max(1, Math.ceil(m*CFG.detour/CFG.driveSpeed));
  let best=null;
  for(const p of PARKS){
    const parkWalk = walkMinFor(haversine(p,shop));
    const min = driveMin(haversine(CFG.office,p)) +
                (p.searchMin!=null?p.searchMin:CFG.parkSearch) + parkWalk;
    if(!best || min<best.min) best={min, park:p, parkWalk};
  }
  const search = shop.ownParking ? 1 : CFG.streetSearch;
  const street = {min: driveMin(haversine(CFG.office,shop)) + search, park:null, parkWalk:0,
                  street:true, searchMin:search};
  return (!best || street.min < best.min) ? street : best;
}
function travelOf(shop){
  const raw = haversine(CFG.office, shop);
  const walk = shop.walkMin != null ? shop.walkMin : walkMinFor(raw);
  const dv = driveVia(shop);
  return {meters:raw, walk, drive:dv.min, park:dv.park, parkWalk:dv.parkWalk,
          street:!!dv.street, searchMin:dv.searchMin, ownParking:!!shop.ownParking};
}
function tierOf(t){
  if(t.walk<=5) return 'w5';
  if(t.walk<=CFG.maxWalkMin) return 'w10';
  if(t.drive<=CFG.maxDriveMin) return 'd10';
  return 'far';
}
/* 「全部」模式：預設走路,只有當開車真的省下 driveWorthIt 分以上才算開車。
   走路 5 分的店不該被說成「開車 4 分」—— 沒人為 400 公尺開車。 */
function pickTravel(t, mode){
  const wOK = t.walk  <= CFG.maxWalkMin;
  const dOK = t.drive <= CFG.maxDriveMin;
  if(mode==='walk')  return wOK ? {min:t.walk,  by:'walk'}  : null;
  if(mode==='drive') return dOK ? {min:t.drive, by:'drive'} : null;
  if(wOK && dOK) return (t.walk - t.drive >= CFG.driveWorthIt)
                        ? {min:t.drive,by:'drive'} : {min:t.walk,by:'walk'};
  if(wOK) return {min:t.walk,  by:'walk'};
  if(dOK) return {min:t.drive, by:'drive'};
  return null;
}

/* ==========================================================================
   3. 核心：午餐可行性
   --------------------------------------------------------------------------
   不是問「現在有沒有開」,而是問：
     出門窗 [departStart, departEnd]、交通 travelMin 分（來回都要）、
     backBy 前回辦公室、坐下來至少 eatMinutes 分 —— 這家今天吃得到嗎?

     可用餐窗 = [departStart + travel, backBy - travel]
     與當天營業時段取交集,交集 >= eatMinutes 才算吃得到。
   ========================================================================== */
function feasibility(shop, dayKey, travelMin, departStart, departEnd){
  const back = toMin(CFG.backBy);
  const winS = departStart + travelMin;
  const winE = back - travelMin;
  const arriveLatest = departEnd + travelMin;
  const out = {winS,winE,travelMin,arriveLatest,code:'',label:'',why:'',usable:0,seg:null,
               suggestDepart:null,latestDepart:null};

  if(winE - winS < CFG.eatMinutes){
    out.code='no_time'; out.label='來回就用掉午休';
    out.why='交通 '+travelMin+' 分 ×2,扣掉後不夠坐下來吃。';
    return out;
  }
  const ranges = (shop.hours && shop.hours[dayKey]) || [];
  if(!ranges.length){
    out.code='closed'; out.label='今天公休';
    out.why = shop.closedNote || (LABEL[dayKey]+'固定公休。');
    return out;
  }
  const segs=[];
  for(const r of ranges){
    let s=toMin(r[0]), e=toMin(r[1]);
    if(e<=s) e+=1440;                                  // 跨夜
    const os=Math.max(s,winS), oe=Math.min(e,winE);
    if(oe-os>0) segs.push({os,oe,open:s,close:e,len:oe-os});
  }
  if(!segs.length){
    out.code='not_lunch'; out.label='午餐時段不營業';
    const closes = ranges.map(r=>{const s=toMin(r[0]),e=toMin(r[1]);return e<=s?e+1440:e;});
    const lastClose=Math.max.apply(null,closes);
    const firstOpen=Math.min.apply(null,ranges.map(r=>toMin(r[0])));
    if(lastClose<=winS)       out.why='今天有開,但 '+fmt(lastClose)+' 就收攤,你最快 '+fmt(winS)+' 才到得了。';
    else if(firstOpen>=winE)  out.why='今天有開,但 '+fmt(firstOpen)+' 才開門,午休來不及。';
    else                      out.why='今天有開,但中午這段休息。營業：'+ranges.map(r=>r[0]+'–'+r[1]).join('、');
    return out;
  }
  segs.sort((a,b)=>b.len-a.len);
  const best=segs[0];
  out.seg=best; out.usable=best.len;
  out.suggestDepart=Math.max(departStart, best.open-travelMin);
  out.latestDepart =best.oe-CFG.eatMinutes-travelMin;

  if(best.len < CFG.eatMinutes){
    out.code='not_enough'; out.label='時間不夠';
    out.why='只開 '+fmt(best.os)+'–'+fmt(best.oe)+'，扣掉來回交通後不夠坐下來吃。';
    return out;
  }
  const lateOpen = best.open > arriveLatest;
  out.code  = lateOpen ? 'tight' : 'ok';
  out.label = lateOpen ? '得晚點出門' : '吃得到';
  /* 只講可行動的：幾點出門、最晚幾點走、能吃多久。
     具體的可用餐窗由時間軸呈現,不必再用文字重複一次。 */
  const bits=[];
  if(lateOpen) bits.push('這家 '+fmt(best.open)+' 才開門,要 <b>'+fmt(out.suggestDepart)+
                         '</b> 出門（超過 '+CFG.depart.end+'）');
  else         bits.push('出門 <b>'+fmt(out.suggestDepart)+'</b>'+
                 (out.latestDepart>departStart
                   ? '（拖到 <b>'+fmt(out.latestDepart)+'</b> 出門還趕得上）' : ''));
  if(best.len < CFG.eatMinutes+10) bits.push('時間有點趕');
  out.why=bits.join(' · ');
  return out;
}
function peakHint(shop,f){
  if(!shop.peak || !f.seg) return null;
  const pf=toMin(shop.peak.from), pt=toMin(shop.peak.to);
  const arrive=Math.max(f.winS,f.seg.os);
  const hit = arrive<pt && arrive>=pf-5;
  return {hit, text:shop.peak.note||(fmt(pf)+'–'+fmt(pt)+' 排隊'),
          advice: hit ? ('建議 '+fmt(Math.max(0,pf-10-f.travelMin))+' 前出門,或改 '+fmt(pt)+' 之後') : null};
}

/* ==========================================================================
   4. 使用者資料（localStorage）
      ratings 結構為 { shopId: { 人名: 分數 } },為多人共用預留。
   ========================================================================== */
const LS='lunchmap.v2';
let ud = {me:'', ratings:{}, notes:{}, eaten:{}, tempClosed:{}, votes:{}, reports:{},
          photos:{},
          menus:{}};
try{ Object.assign(ud, JSON.parse(localStorage.getItem(LS)||'{}')); }catch(e){}
if(!ud.me) ud.me = '我';
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(ud)); }catch(e){} };

function scoreOf(id){
  const r = ud.ratings[id]||{};
  const vals = Object.keys(r).map(k=>r[k]).filter(v=>v>0);
  const n = vals.length;
  const avg = n ? vals.reduce((a,b)=>a+b,0)/n : 0;
  return {avg, n, mine: r[ud.me]||0};
}
function rate(id, n){
  ud.ratings[id] = ud.ratings[id] || {};
  if(ud.ratings[id][ud.me]===n) delete ud.ratings[id][ud.me];
  else ud.ratings[id][ud.me]=n;
  save(); render();
}
function daysSinceEaten(id){
  const log=ud.eaten[id]; if(!log||!log.length) return null;
  const t=new Date(today()+'T00:00:00').getTime();
  let best=null;
  for(const d of log){
    const diff=Math.round((t-new Date(d+'T00:00:00').getTime())/86400000);
    if(diff>=0 && (best===null||diff<best)) best=diff;
  }
  return best;
}
function markEaten(id){
  ud.eaten[id]=ud.eaten[id]||[];
  if(!ud.eaten[id].includes(today())) ud.eaten[id].push(today());
  ud.eaten[id]=ud.eaten[id].slice(-12); save(); render();
}
function toggleTempClosed(id){
  if(ud.tempClosed[id]===today()) delete ud.tempClosed[id]; else ud.tempClosed[id]=today();
  save(); render();
}

  secOpen:{desserts:true, drinks:true}
};
if(state.day===todayKey() && nowMin()>toMin(CFG.depart.end) && nowMin()<toMin(CFG.backBy)) state.useNow=true;

function departWindow(){
  const isToday = state.day===todayKey();
  if(state.useNow && isToday){ const n=nowMin(); return {s:n,e:n,now:true}; }
  return {s:toMin(CFG.depart.start), e:toMin(CFG.depart.end), now:false};
}

/* ==========================================================================
   6. 計算 / 篩選 / 排序
   ========================================================================== */
function computeAll(){
  const dw=departWindow(), isToday=state.day===todayKey();
  return SHOPS.map(sh=>{
    const t=travelOf(sh), tier=tierOf(t), pt=pickTravel(t,state.mode);
    let f;
    if(!pt) f={code:'out_of_range',label:'超出範圍',usable:0,travelMin:null,seg:null,
               why:'走路 '+t.walk+' 分 / 開車 '+t.drive+' 分,超過設定上限。'};
    else if(isToday && ud.tempClosed[sh.id]===today())
      f={code:'temp',label:'今天臨時公休',usable:0,travelMin:pt.min,seg:null,
         why:'有人回報今天臨時公休（只影響今天）。'};
    else if(sh.hoursUnknown)
      /* 未知 ≠ 公休。OSM 沒這家的營業時間,所以不能說牠今天沒開,
         也不能算進「吃得到」—— 自己確認過再把 hours 填進 shops.js。 */
      f={code:'unknown',label:'營業時間未知',usable:0,travelMin:pt.min,seg:null,
         why:'OSM 上沒有這家的營業時間。<b>走路 '+t.walk+' 分</b>會到,'+
             '確認過營業時間後填進 <code>shops.js</code> 的 hours,就會納入判斷。'};
    else f=feasibility(sh, state.day, pt.min, dw.s, dw.e);
    const sc=scoreOf(sh.id);
    return {sh,t,tier,by:pt?pt.by:null,f,sc,
            note: ud.notes[sh.id]!=null?ud.notes[sh.id]:(sh.note||''),
            ate:daysSinceEaten(sh.id), votes:ud.votes[sh.id]||0,
            feasible: f.code==='ok'||f.code==='tight'};
  });
}
/* 評分過濾。關鍵分別：「沒人評分」不等於「評分差」——
   未評分的店是未知,不該被當成地雷濾掉,只標示「還沒人評」。
   真正被濾掉的是有人評、平均卻低於門檻的。 */
function passScore(r){
  /* Google 星等是獨立的門檻：沒有星等的店不擋（很多小攤 Google 上沒登錄,
     那是「不知道」不是「難吃」）。 */
  if(state.minGoogle && r.sh.googleRating != null &&
     r.sh.googleRating < state.minGoogle) return false;
  if(!r.sc.n) return !state.hideUnrated;
  if(state.hideBad && r.sc.avg < state.badBelow) return false;
  if(state.minScore && r.sc.avg < state.minScore) return false;
  return true;
}
function passFilter(r){
  if(r.tier==='far' || r.f.code==='out_of_range') return false;
  if(!passScore(r)) return false;
  if(state.tier.size && !state.tier.has(r.tier)) return false;
  /* 「只看吃得到的」是指確定吃得到。時間未知的另外用 showUnknown 控制,
     否則一開就把大部分還沒填時間的店整批藏起來,反而看不到要補什麼。 */
  if(state.onlyOpen && !r.feasible && !(state.showUnknown && r.f.code==='unknown'))
    return false;
  if(state.cat.size && !state.cat.has(r.sh.category||'其他')) return false;
  if(state.price.size && !state.price.has(String(r.sh.price||''))) return false;
  if(state.service.size){
    const sv=r.sh.service||[]; let hit=false;
    state.service.forEach(x=>{ if(sv.indexOf(x)>=0) hit=true; });
    if(!hit) return false;
  }
  return true;
}
const RANK={ok:0,tight:1,unknown:2,not_enough:3,not_lunch:4,closed:5,temp:6,
            no_time:7,out_of_range:8};
function sortRows(rows){
  const K={ travel:r=>(r.f.travelMin==null?99:r.f.travelMin),
            score :r=>-(r.sc.n?r.sc.avg:0),
            usable:r=>-r.f.usable,
            votes :r=>-r.votes }[state.sort];
  return rows.sort((a,b)=>
    (RANK[a.f.code]-RANK[b.f.code]) || (K(a)-K(b)) ||
    ((a.f.travelMin==null?99:a.f.travelMin)-(b.f.travelMin==null?99:b.f.travelMin)) ||
    a.sh.name.localeCompare(b.sh.name,'zh-Hant'));
}


/* ==========================================================================
   看行情決定吃什麼
   --------------------------------------------------------------------------
   資料來自 market.js（跑 market.py 更新）。為什麼不讓網頁自己抓：
   證交所 OpenAPI 與 Yahoo 都沒有回 Access-Control-Allow-Origin,
   瀏覽器會擋掉跨網域請求;同資料夾的 .js 檔沒這個問題。

   心情 -> 價位偏好。大部分店家的 price 還是 null（OSM 沒有價位欄位）,
   所以另外用「類別」當替代訊號：便當／自助餐／麵這類算便宜,
   牛排／海鮮／火鍋算貴。price 填好之後會以 price 為準。
   ========================================================================== */
const MKT = window.MARKET || null;
const CHEAP_CAT = ['便當','自助餐','麵','水餃','小吃','速食','早餐'];
const FANCY_CAT = ['牛排','海鮮','火鍋'];
const MOOD = {
  up:   {label:'加菜',   hint:'貴一點', fancy:2.2, cheap:0.55},
  flat: {label:'平盤',   hint:'不影響', fancy:1,   cheap:1},
  down: {label:'省一點', hint:'便宜',   fancy:0.4, cheap:2.2}
};
function moodFromPct(p){
  if(p==null) return null;
  if(p >=  0.3) return 'up';
  if(p <= -0.3) return 'down';
  return 'flat';
}
/* 目前生效的心情：手動優先,否則看 market.js */
function currentMood(){
  if(state.mood!=='auto') return state.mood;
  return MKT ? moodFromPct(MKT.pct) : null;
}
/* 這家店偏貴還是偏便宜 —— price 有填就用 price,沒填才看類別 */
function priceTilt(sh){
  if(sh.price!=null) return sh.price>=3 ? 'fancy' : 'cheap';
  const c = sh.category||'';
  if(FANCY_CAT.indexOf(c)>=0) return 'fancy';
  if(CHEAP_CAT.indexOf(c)>=0) return 'cheap';
  return null;
}
function moodWeight(sh){
  const m = currentMood();
  if(!m || m==='flat') return 1;
  const t = priceTilt(sh);
  if(!t) return 1;
  return MOOD[m][t];
}
function renderMarket(){
  const el=document.getElementById('mktPill');
  if(!el) return;
  const m=currentMood();
  if(!m){
    el.textContent='行情未知';
    el.title='沒有 market.js。跑 python market.py 抓今天的加權指數,或在「篩選」裡手動選。';
    el.className='mkt off';
    return;
  }
  const manual = state.mood!=='auto';
  const stale  = MKT && MKT.date!==today();
  el.className='mkt '+m;
  el.textContent = (MKT && !manual
      ? (MKT.index+' '+(MKT.pct>0?'+':'')+MKT.pct+'%')
      : '手動') + ' · ' + MOOD[m].label;
  el.title = (MKT ? MKT.index+' '+MKT.close+'（'+(MKT.pct>0?'+':'')+MKT.pct+'%）'+
                    MKT.date+' 來源 '+MKT.src+(stale?'  ⚠ 不是今天的,跑 market.py 更新':'')
                  : '手動指定') + '　→ ' + MOOD[m].hint;
  const info=document.getElementById('mktInfo');
  if(info) info.textContent = MKT
    ? (MKT.index+' '+MKT.close+'（'+(MKT.pct>0?'+':'')+MKT.pct+'%）'+MKT.date+
       (stale?' ⚠ 不是今天的,跑 python market.py 更新':'')+
       '。'+(m==='flat'?'平盤,不影響隨機推薦。':'隨機推薦會偏向'+MOOD[m].hint+'的店。'))
    : '沒有 market.js —— 跑 python market.py 抓加權指數,或在上面手動選。';
  [].forEach.call(document.getElementById('moodSeg').children,
    b=>b.classList.toggle('on', b.dataset.mood===state.mood));
}

/* ==========================================================================
   7. 隨機推薦（用大家的平均評分加權 + 行情）
   ========================================================================== */
function randomPick(){
  const pool=computeAll().filter(r=>passFilter(r)&&r.feasible);
  if(!pool.length){ state.pick={empty:true}; render(); return; }
  const W=pool.map(r=>{
    let w=1;
    /* 優先用大家的評分;沒有的話退而用 Google 星等;都沒有才當中性 3 分。 */
    const base = r.sc.n ? r.sc.avg
               : (r.sh.googleRating != null ? r.sh.googleRating : 3);
    w *= Math.pow(base/3, 2);                     // 平均分越高、越常被抽到
    w *= 1 + Math.min(r.sc.n,5)*0.06;             // 評分人數多一點,可信度加一點
    if(r.ate!==null && r.ate<7) w *= 0.2;         // 7 天內吃過大幅降權
    if(r.f.code==='tight')      w *= 0.6;
    w *= moodWeight(r.sh);                        // 看行情偏貴或偏便宜
    return {r, w:Math.max(0.05,w)};
  });
  const total=W.reduce((s,x)=>s+x.w,0);
  let x=Math.random()*total;
  for(const it of W){ x-=it.w; if(x<=0){ state.pick={row:it.r,weights:W,total}; render(); return; } }
  state.pick={row:W[W.length-1].r,weights:W,total}; render();
}

/* ==========================================================================
   8. 地圖
   ========================================================================== */
let map=null, layer=null, parkLayer=null, marks={};
function initMap(){
  if(typeof L==='undefined'){
    const m=document.getElementById('mapmsg');
    m.style.display='grid';
    m.textContent='地圖載入失敗（Leaflet 由 CDN 載入,需要網路）。清單功能不受影響。';
    return;
  }
  map=L.map('map').setView([CFG.office.lat,CFG.office.lng],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  L.marker([CFG.office.lat,CFG.office.lng],{title:CFG.office.name})
    .addTo(map).bindPopup('<b>'+CFG.office.name+'</b>');
  const rings=L.layerGroup().addTo(map);
  [[5,'#1d4ed8'],[10,'#64748b']].forEach(function(x){
    L.circle([CFG.office.lat,CFG.office.lng],
      {radius:x[0]*CFG.walkSpeed/CFG.detour,color:x[1],weight:1,dashArray:'4 5',
       fill:false,interactive:false}).addTo(rings);
  });
  parkLayer=L.layerGroup();
  layer=L.layerGroup().addTo(map);
}
/* 標記顏色直接讀 CSS token,深色主題切換時地圖跟著變 */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CMAP = {ok:'--ok',tight:'--tight',unknown:'--nobar',not_enough:'--tight',
              not_lunch:'--no',closed:'--closed',temp:'--closed',no_time:'--no'};
const COLOR = new Proxy(CMAP,{get:(m,k)=> m[k] ? (cssVar(m[k])||'#64748b') : undefined});
function drawMap(rows){
  if(!map||!layer) return;
  layer.clearLayers(); marks={};
  rows.forEach(r=>{
    const c=COLOR[r.f.code]||'#64748b';
    const m=L.circleMarker([r.sh.lat,r.sh.lng],
      {radius:8,color:cssVar('--card'),weight:2,fillColor:c,fillOpacity:.95});
    m.bindPopup('<b>'+esc(r.sh.name)+'</b><br>'+
      '<span style="color:'+c+';font-weight:700">'+esc(r.f.label)+'</span> · '+travelText(r)+
      (r.sc.n?' · ★'+r.sc.avg.toFixed(1)+'（'+r.sc.n+' 人）':'')+'<br>'+
      (r.by==='drive'?'<span style="color:'+cssVar('--park')+';font-size:12px">🅿 '+
        (r.t.park?'停 '+esc(r.t.park.name)+' → 走 '+r.t.parkWalk+' 分'
                 :(r.t.ownParking?'店家自有停車場':'路邊停,找位抓 '+r.t.searchMin+' 分'))+
        '</span><br>':'')+
      '<span style="color:'+cssVar('--dim')+';font-size:12px">'+r.f.why+'</span>');
    m.on('click',()=>{ state.sel=r.sh.id; renderList(); });
    m.addTo(layer); marks[r.sh.id]=m;
  });
  AFTER.forEach(sec=>sec.arr.forEach(d=>{
    const t=travelOf(d);
    if(tierOf(t)==='far') return;
    const st=openNowState(d);
    const c = st.code==='open' ? cssVar(sec.tok) : cssVar('--no');
    L.circleMarker([d.lat,d.lng],{radius:5,color:cssVar('--card'),weight:2,
        fillColor:c,fillOpacity:.9})
     .bindPopup('<b>'+esc(d.name)+'</b><br><span style="font-size:12px">'+
       esc((d.kind||sec.sub)+' · '+st.label)+'</span>')
     .addTo(layer);
  }));
  parkLayer.clearLayers();
  PARKS.forEach(p=>{
    L.circleMarker([p.lat,p.lng],{radius:6,color:cssVar('--card'),weight:2,fillColor:cssVar('--park'),fillOpacity:.9})
     .bindPopup('<b>🅿 '+esc(p.name)+'</b><br><span style="font-size:12px;color:'+cssVar('--dim')+'">'+
       esc([p.kind,p.rate,(p.spaces?p.spaces+' 車位':'')].filter(Boolean).join(' · ')||'停車場')+'</span>')
     .addTo(parkLayer);
  });
  if(state.showPark) parkLayer.addTo(map); else map.removeLayer(parkLayer);
}

/* 範例資料提示的後半段。build-shared.py 會把這一整行換成共享版的說法。 */
const SAMPLE_TAIL = '是範例資料（店名／營業時間／座標都要換）。這份共享版的店家資料是發布時內嵌進去的：要修改請編輯 <code>shops.js</code>，跑 <code>build-shared.py</code>，再重新發布。本機版（index.html）另有地圖與「從 OpenStreetMap 匯入」，可以抓真實店名與座標。';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function travelText(r){
  if(!r.by) return '走路 '+r.t.walk+' 分 / 開車 '+r.t.drive+' 分';
  return (r.by==='walk'?'走路 ':'開車 ')+(r.by==='walk'?r.t.walk:r.t.drive)+' 分';
}
const STCLS={ok:'ok',tight:'tight',unknown:'unk',not_enough:'tight',not_lunch:'no',
             closed:'closed',temp:'closed',no_time:'no',out_of_range:'no'};

function render(){ renderHeader(); renderChips(); renderMarket();
                   renderBanners(); renderPick(); renderList(); }

function renderHeader(){
  const d=new Date();
  document.getElementById('clock').textContent=dstr(d)+'（'+LABEL[todayKey()]+'）'+fmt(nowMin());
  document.getElementById('where').textContent=CFG.office.name;

        : CFG.depart.start+'–'+CFG.depart.end+' 出門')+' · 用餐 '+CFG.eatMinutes+' 分';
  const mi=document.getElementById('meName');

      b.onclick=()=>{ state.day=k; state.pick=null; render(); };
      tb.appendChild(b);
    });
  } else [].forEach.call(tb.children,b=>b.classList.toggle('on',b.dataset.d===state.day));
}
function renderChips(){

  const ph=document.getElementById('priceChips');
  if(!ph.children.length){
    (CFG.priceBands||[]).forEach(b=>{
      const x=document.createElement('button');
      x.className='chip'; x.dataset.f='price'; x.dataset.v=String(b.v);
      x.textContent=b.label;
      ph.appendChild(x); bindChip(x);

  const host=document.getElementById('catChips');
  if(!host.children.length){
    const cats=Object.keys(SHOPS.reduce((o,s)=>{o[s.category||'其他']=1;return o;},{}))
                     .sort((a,b)=>a.localeCompare(b,'zh-Hant'));

  (function(b){ if(b) b.classList.toggle('on',state.showPark); })(document.getElementById('showPark'));

    b=>b.classList.toggle('on', Number(b.dataset.s)===state.minScore));
  [].forEach.call(document.getElementById('gSeg').children,
    b=>b.classList.toggle('on', Number(b.dataset.g)===state.minGoogle));

  /* 篩選按鈕上的數字 = 目前偏離預設的條件數,讓收起來的抽屜不會藏住設定 */

function renderBanners(){

        '並刪掉該筆的 <code>hoursUnknown: true</code>,那家就會納入判斷。'+
        '建議先補走路 5 分內的幾家。');

function renderPick(){
  const host=document.getElementById('pick'); host.innerHTML='';
  if(!state.pick) return;
  const d=document.createElement('div'); d.className='pickcard';
  if(state.pick.empty){
    d.innerHTML='<div><div class="eyebrow">抽不出來</div>'+
      '<div class="sub">目前篩選條件下,'+LABEL[state.day]+
      '沒有<b>確定</b>吃得到的店（時間未知的不會被抽中）。'+
      '放寬距離,或先把幾家的營業時間填進 shops.js。</div></div>';
    host.appendChild(d); return;
  }
  const r=state.pick.row;

/* ==========================================================================
   吃飽再買 —— 飲料與咖啡
   --------------------------------------------------------------------------
   這一區的問題跟餐廳不一樣：你已經吃完了,要問的是「現在這個時間哪裡有開」,
   而不是「午餐時段吃不吃得到」。所以用現在的鐘點直接判斷,不套午休窗邏輯。
   ========================================================================== */
const NOWORD = {open:0, unknown:1, later:2, closed:3};
function openNowState(d){
  if(d.hoursUnknown) return {code:'unknown', label:'時間未知'};
  const rr=((d.hours && d.hours[todayKey()]) || []).slice()
             .sort((a,b)=>toMin(a[0])-toMin(b[0]));
  if(!rr.length) return {code:'closed', label:'今天公休'};
  const n=nowMin();
  for(const x of rr){
    let a=toMin(x[0]), b=toMin(x[1]); if(b<=a) b+=1440;
    if(n>=a && n<b) return {code:'open',  label:'現在有開', note:'開到 '+fmt(b)};
    if(n<a)         return {code:'later', label:fmt(a)+' 才開'};
  }
  return {code:'closed', label:'今天已打烊'};
}

/* ==========================================================================
   錯誤回報
   --------------------------------------------------------------------------
   為什麼需要：這份資料的營業時間有三個來源（OSM、網路整理文、Google 地圖）,
   全部都會過期。實際跑一趟才知道的事（收攤了、改時間了、根本沒這家店）
   要有地方記下來,否則同一個坑每個人各踩一次。

   getReports / addReport / resolveReport 三個函式在共享版會被覆寫成

/* ==========================================================================
   菜單照片 —— 可以共享,也可以只給自己
   --------------------------------------------------------------------------
   這個 Artifact 沒有可以放檔案的檔案庫（能宣告的 capability 只有
   artifact / downloads / mcp / self,沒有 assets）,所以「共享照片」是塞進
   共享文件本身：在同步區塊裡幫每張照片開一個子元素,base64 放屬性。

   所以兩種照片壓縮強度差很多：
     只有我 → 長邊 1400 / q0.65,存自己的 localStorage（上限約 5 MB）
     共享   → 長邊 1000 / q0.5,而且會一路降到 110 KB 以下才送出。
              壓不下去就拒絕 —— 共享文件塞爆的話大家都打不開。
   ========================================================================== */
const PHOTO_MAX = 1400, PHOTO_Q = 0.65;          /* 私人 */
const SHARED_MAX = 1000, SHARED_Q = 0.5;         /* 共享起點 */
const SHARED_CAP = 110 * 1024;                   /* 共享單張上限（dataURL 長度）*/

/* 共享版會覆寫這三個。本機版沒有共享機制,所以是空的。 */
function canShare(){ return false; }
function sharedPhotos(){ return []; }
function pushSharedPhoto(){ return Promise.reject({code:'not_declared'}); }
function dropSharedPhoto(){ return Promise.reject({code:'not_declared'}); }

function ownPhotos(id){ return (ud.photos && ud.photos[id]) || []; }

/* 共享的排前面 —— 別人拍的比自己的有用（自己那張你本來就看過了）*/
function getPhotos(id){
  return sharedPhotos(id).map(p => Object.assign({}, p, {shared:true}))
    .concat(ownPhotos(id).map((p,i) => Object.assign({}, p, {shared:false, i:i})));
}
function photoCount(id){ return getPhotos(id).length; }

/* 縮圖 + 壓縮。cap 有給就一路降畫質／尺寸直到過關,回 null 表示壓不下去。 */
function squash(img, maxPx, q, cap){
  const enc = (px, qq) => {
    const sc = Math.min(1, px / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.width * sc));
    cv.height = Math.max(1, Math.round(img.height * sc));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', qq);
  };
  let url = enc(maxPx, q);
  if(!cap) return url;
  /* 菜單看板通常降到 800px/q0.35 還讀得出來,再低就不用勉強了 */
  const steps = [[maxPx,q],[maxPx,0.4],[900,0.4],[800,0.35],[700,0.3]];
  for(const st of steps){
    url = enc(st[0], st[1]);
    if(url.length <= cap) return url;
  }
  return null;
}

/* shared=true 就送進共享文件,false 就存自己的瀏覽器 */
function addPhoto(id, file, shared){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      if(shared){
        const url = squash(img, SHARED_MAX, SHARED_Q, SHARED_CAP);
        if(!url){
          toast('這張壓不到 110 KB 以下（共享照片有上限）—— 拍近一點、只拍菜單那面');
          return;
        }
        const kb = Math.round(url.length * 0.75 / 1024);
        pushSharedPhoto(id, {u:url, d:today(), who:ud.me||'匿名', kb:kb})
          .then(() => toast('共享照片存好了（'+kb+' KB）,同事都看得到'))
          .catch(err => {
            const c = (err && err.code) || '';
            if(c === 'too_large' || c === 'invalid_content')
              toast('共享文件塞不下這張 —— 先刪掉幾張舊的共享照片,或拍近一點');
            else if(c === 'not_writer' || c === 'not_granted') toast('你是唯讀檢視,不能上傳');
            else if(c === 'not_declared') toast('本機版沒有共享功能 —— 請在共享版的網址上傳');
            else toast('沒傳上去（'+(c||'連線問題')+'）,再試一次');
          });
        return;
      }
      const url = squash(img, PHOTO_MAX, PHOTO_Q, 0);
      const kb = Math.round(url.length * 0.75 / 1024);
      ud.photos[id] = ownPhotos(id).concat([{u:url, d:today(), who:ud.me||'匿名', kb:kb}]);
      try {
        save();
      } catch(e){
        ud.photos[id].pop();
        toast('存不下了（瀏覽器空間滿）—— 先刪掉幾張,或改成共享上傳');
        return;
      }
      render();
      toast('照片存好了（'+kb+' KB）,只有你看得到');
    };
    img.onerror = () => toast('這個檔案讀不出來,確定是圖片嗎?');
    img.src = fr.result;
  };
  fr.onerror = () => toast('檔案讀取失敗');
  fr.readAsDataURL(file);
}

/* 選了檔案之後問要不要共享。不能共享（本機版／唯讀）就直接存自己的。 */
function askShare(id, file){
  if(!file) return;

function delPhoto(id, p){
  if(p.shared){
    dropSharedPhoto(id, p.key)
      .then(() => toast('已刪除共享照片'))

  const a = ownPhotos(id).slice();

function renderList(){
  const all=computeAll(), rows=sortRows(all.filter(passFilter));
  const far=all.filter(r=>r.tier==='far'||r.f.code==='out_of_range').length;
  const cutByScore=all.filter(r=>r.tier!=='far'&&r.f.code!=='out_of_range'&&!passScore(r)).length;
  const okN=rows.filter(r=>r.f.code==='ok').length, tiN=rows.filter(r=>r.f.code==='tight').length;
  const unkN=rows.filter(r=>r.f.code==='unknown').length;
  const bits=['<b>'+okN+'</b> 家吃得到'];
  if(tiN)  bits.push('<b>'+tiN+'</b> 家得晚出門');
  if(unkN) bits.push('<span class="warn"><b>'+unkN+'</b> 家時間未知</span>');
  if(rows.length-okN-tiN-unkN>0)
    bits.push('<b>'+(rows.length-okN-tiN-unkN)+'</b> 家今天不行');
  if(cutByScore) bits.push('<span class="warn">'+cutByScore+' 家因評分被排除</span>');
  if(far)        bits.push('<span class="warn">'+far+' 家超出範圍未列</span>');
  document.getElementById('count').innerHTML=
    '<b>'+LABEL[state.day]+'</b>'+bits.map(x=>'<span class="dot">·</span>'+x).join('');
  const host=document.getElementById('list'); host.innerHTML='';
  if(!rows.length)
    host.innerHTML='<div class="shop"><div class="why">沒有符合條件的店。試著放寬距離,或關掉「只看吃得到的」。</div></div>';
  rows.forEach(r=>host.appendChild(card(r)));
  renderAfter();
  drawMap(rows);
}


/* ==========================================================================
   午休時間軸 —— 整張卡片的主角。
   軌道 = 出門時刻 到 回辦公室時刻（預設 11:30 → 13:00）。上面疊：
     tb-open  當天營業時段（淡底,看得出這家中午到底有沒有開）
     tb-go/back  去程與回程交通（斜線,那段時間你在路上）
     tb-wait  到了但還沒開門要等
     tb-eat   真正能坐下來吃的那一段（用狀態色）
     tb-peak  排隊尖峰
   一眼可讀「窗口落在早段還是晚段、有多寬」,這是數字給不了的。
   ========================================================================== */
function timebar(r){
  const dw=departWindow(), T0=dw.s, T1=toMin(CFG.backBy), span=T1-T0;
  if(span<=0) return '';
  const L = m => Math.max(0, Math.min(100, (m-T0)/span*100));
  const piece = (cls,a,b,css) => {
    const l=L(a), w=L(b)-l;
    if(w<=0) return '';
    return '<i class="'+cls+'" style="left:'+l.toFixed(2)+'%;width:'+
           Math.max(w,0.7).toFixed(2)+'%'+(css||'')+'"></i>';
  };
  const f=r.f, tm=f.travelMin;
  let h='';
  /* 未知：整條畫成虛紋,表示「這段時間有沒有開不知道」,
     而不是留白（留白會被讀成「沒開」）。 */
  if(f.code==='unknown') h+=piece('tb-unknown',T0,T1);
  ((r.sh.hours && r.sh.hours[state.day]) || []).forEach(x=>{
    let a=toMin(x[0]), b=toMin(x[1]); if(b<=a) b+=1440;
    h += piece('tb-open',a,b);
  });
  if(tm!=null){
    h += piece('tb-go',   T0, T0+tm);
    h += piece('tb-back', T1-tm, T1);
  }
  if(f.seg){
    const arrive=T0+(tm||0);
    if(f.seg.os>arrive) h += piece('tb-wait', arrive, f.seg.os);
    const bar = f.code==='ok' ? '--okbar'
              : (f.code==='tight'||f.code==='not_enough') ? '--tightbar' : '--nobar';
    h += piece('tb-eat', f.seg.os, f.seg.oe, ';background:var('+bar+')');
  }
  if(r.sh.peak){
    h += piece('tb-peak', Math.max(toMin(r.sh.peak.from),T0),
                          Math.min(toMin(r.sh.peak.to),T1));
  }
  for(let m=Math.ceil(T0/30)*30; m<T1; m+=30){          // 每半小時一道刻度
    if(m<=T0) continue;
    h += '<u style="left:'+L(m).toFixed(2)+'%"></u>';
  }
  const tip = f.seg ? ('可用餐 '+fmt(f.seg.os)+'–'+fmt(f.seg.oe)) : f.label;
  return '<div class="tl"><span class="track-cap">'+fmt(T0)+'</span>'+
         '<span class="track" title="'+esc(tip)+'">'+h+'</span>'+
         '<span class="track-cap">'+fmt(T1)+'</span></div>';
}

/* ==========================================================================
   12. OSM 匯入（Overpass API,免 key）
   ========================================================================== */
const OSM_D={Mo:'mon',Tu:'tue',We:'wed',Th:'thu',Fr:'fri',Sa:'sat',Su:'sun'};
function expandDays(spec){
  const out=[];
  for(const part of spec.split(',')){
    const m=part.match(/^(Mo|Tu|We|Th|Fr|Sa|Su)(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?$/);
    if(!m) return null;
    const a=ORDER.indexOf(OSM_D[m[1]]);
    if(!m[2]){ out.push(ORDER[a]); continue; }
    const b=ORDER.indexOf(OSM_D[m[2]]);
    for(let i=a;;i=(i+1)%7){ out.push(ORDER[i]); if(i===b) break; }
  }
  return out.filter((v,i,a)=>a.indexOf(v)===i);
}
function parseOsmHours(str){
  if(!str) return null;
  str=str.trim();
  if(/^24\/7$/.test(str)){ const o={}; ORDER.forEach(d=>o[d]=[["00:00","24:00"]]); return o; }
  const out={}; ORDER.forEach(d=>out[d]=null);
  for(let rule of str.split(';')){
    rule=rule.trim(); if(!rule) continue;
    const m=rule.match(/^((?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?(?:,(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?)*)\s+(.+)$/);
    if(!m) return null;
    const days=expandDays(m[1]); if(!days) return null;
    const body=m[2].trim();
    if(/^off$/i.test(body)){ days.forEach(d=>out[d]=[]); continue; }
    const spans=[];
    for(const seg of body.split(',')){
      const t=seg.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
      if(!t) return null;
      spans.push([String(t[1]).padStart(2,'0')+':'+t[2],String(t[3]).padStart(2,'0')+':'+t[4]]);
    }
    days.forEach(d=>out[d]=spans.map(s=>s.slice()));
  }
  ORDER.forEach(d=>{ if(out[d]===null) out[d]=[]; });
  return out;
}
const OSM_CAT=[[/noodle|ramen|拉麵|麵/i,'麵'],[/bento|便當/i,'便當'],[/buffet|自助/i,'自助餐'],
               [/vegetarian|vegan|素/i,'素食'],[/cafe|coffee|brunch|早午餐/i,'早午餐'],
               [/rice|飯|丼/i,'飯']];
async function overpass(query){
  const res=await fetch('https://overpass-api.de/api/interpreter',
    {method:'POST',body:'data='+encodeURIComponent(query),
     headers:{'Content-Type':'application/x-www-form-urlencoded'}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
function osmFail(err){
  showModal('匯入失敗','Overpass API 連線失敗：'+esc(err.message)+'<br>'+
    '常見原因：沒網路、Overpass 忙線（稍後再試）,或以 <code>file://</code> 開啟時被瀏覽器擋掉跨網域請求。'+
    '後者請改用本機伺服器開啟（見 README）。','');
}
async function osmShops(){
  showModal('從 OpenStreetMap 匯入店家','正在查詢辦公室周邊 800 公尺內的餐飲點…','');
  try{
    const j=await overpass('[out:json][timeout:30];('+
      'nwr["amenity"~"^(restaurant|fast_food|cafe|food_court)$"](around:800,'+
      CFG.office.lat+','+CFG.office.lng+'););out center tags;');
    const seen={}; SHOPS.forEach(s=>seen[s.name]=1);
    const items=(j.elements||[]).map(e=>{
      const la=e.lat!=null?e.lat:(e.center&&e.center.lat);
      const ln=e.lon!=null?e.lon:(e.center&&e.center.lon);
      const tg=e.tags||{}, nm=tg['name:zh']||tg.name;
      return (nm&&la!=null&&!seen[nm]) ? {nm,la,ln,tg} : null;
    }).filter(Boolean).map(x=>{
      const t=travelOf({lat:x.la,lng:x.ln}); x.t=t; x.tier=tierOf(t); return x;
    }).filter(x=>x.tier!=='far').sort((a,b)=>a.t.walk-b.t.walk);

    if(!items.length){ showModal('匯入結果','範圍內沒有找到新的餐飲點（或 OSM 上沒有資料）。',''); return; }
    let code='  /* ==== 由 OpenStreetMap 匯入店家 '+today()+' ==== */\n', parsed=0;
    items.forEach((x,i)=>{
      const h=parseOsmHours(x.tg.opening_hours); if(h) parsed++;
      const hit=OSM_CAT.filter(c=>c[0].test(x.nm)||c[0].test(x.tg.cuisine||''))[0];
      const hoursTxt = ORDER.map(d=>'        '+d+': ['+
        (h?h[d].map(s=>'["'+s[0]+'","'+s[1]+'"]').join(', '):'')+']').join(',\n');
      code+='  {\n    id: "osm'+String(i+1).padStart(3,'0')+'",'+(h?'':' needsReview: true,')+'\n'+
        '    name: '+JSON.stringify(x.nm)+',\n'+
        '    lat: '+x.la.toFixed(6)+', lng: '+x.ln.toFixed(6)+
        ',   // 走路約 '+x.t.walk+' 分 / 開車約 '+x.t.drive+' 分\n'+
        '    category: "'+(hit?hit[1]:'其他')+'", price: 2,\n'+
        '    service: ["dine_in", "takeout"],\n    hours: {\n'+hoursTxt+'\n    },\n'+
        (x.tg.opening_hours&&!h?'    hoursRaw: '+JSON.stringify(x.tg.opening_hours)+
          ',   // ← 無法自動解析,請手填上面 hours\n':'')+
        '    note: ""\n  },\n';
    });
    showModal('匯入結果：'+items.length+' 家店',
      '抓到 <b>'+items.length+'</b> 家（範圍內、名稱不重複）。其中 <b>'+parsed+'</b> 家的 OSM 營業時間可自動解析,'+
      '另外 <b>'+(items.length-parsed)+'</b> 家的 <code>hours</code> 是空的（會被判成「今天公休」）,需要你手填 —— '+
      '這步無法自動化,OSM 的營業時間本來就常缺漏或過期。<br>把下面整段貼進 <code>shops.js</code> 的 '+
      '<code>shops: [ … ]</code> 陣列裡。', code);
  }catch(err){ osmFail(err); }
}
async function osmParks(){
  showModal('從 OpenStreetMap 匯入停車場','正在查詢辦公室周邊 1000 公尺內的停車場…','');
  try{
    const j=await overpass('[out:json][timeout:30];('+
      'nwr["amenity"="parking"](around:1000,'+CFG.office.lat+','+CFG.office.lng+'););out center tags;');
    const seen={}; PARKS.forEach(p=>seen[p.name]=1);
    const items=(j.elements||[]).map(e=>{
      const la=e.lat!=null?e.lat:(e.center&&e.center.lat);
      const ln=e.lon!=null?e.lon:(e.center&&e.center.lon);
      const tg=e.tags||{};
      if(la==null) return null;
      if(tg.access&&/private|no/.test(tg.access)) return null;   // 私人車位跳過
      const nm=tg['name:zh']||tg.name||('無名停車場（'+(tg.parking||'')+'）');
      return seen[nm]?null:{nm,la,ln,tg};
    }).filter(Boolean).map(x=>{
      x.driveMin=Math.max(1,Math.ceil(haversine(CFG.office,{lat:x.la,lng:x.ln})*CFG.detour/CFG.driveSpeed));
      return x;
    }).sort((a,b)=>a.driveMin-b.driveMin);
    if(!items.length){ showModal('匯入結果','範圍內沒找到新的公共停車場。',''); return; }
    const KIND={multi_storey:'立體',underground:'地下',surface:'平面',street_side:'路邊',lane:'路邊'};
    let code='  /* ==== 由 OpenStreetMap 匯入停車場 '+today()+' ==== */\n';
    items.forEach((x,i)=>{
      const tg=x.tg;
      const fee = tg.fee==='no' ? '免費' : (tg.charge||tg['fee:conditional']||'');
      code+='  {\n    id: "pk'+String(i+1).padStart(2,'0')+'",\n'+
        '    name: '+JSON.stringify(x.nm)+',\n'+
        '    lat: '+x.la.toFixed(6)+', lng: '+x.ln.toFixed(6)+',   // 開車約 '+x.driveMin+' 分\n'+
        '    kind: "'+(KIND[tg.parking]||'停車場')+'"'+
        (fee?', rate: '+JSON.stringify(fee):', rate: ""')+
        (tg.capacity?', spaces: '+parseInt(tg.capacity,10):'')+',\n'+
        '    searchMin: 3   // 找車位大概要幾分鐘,實際跑過再調\n  },\n';
    });
    showModal('匯入結果：'+items.length+' 個停車場',
      '抓到 <b>'+items.length+'</b> 個公共停車場（已排除標記為私人的）。貼進 <code>shops.js</code> 的 '+
      '<code>parkings: [ … ]</code> 陣列。<br>加進去之後,「開車」時間就會改用 '+
      '<b>開到停車場 + 找位 + 走到店</b> 來算,而不是原本那個固定加成 —— '+
      '嘟嘟房這類收費停車場如果 OSM 上沒有,自己補一筆也一樣有效。<br>'+
      '費率欄位 OSM 常常是空的,自己填比較準。', code);
  }catch(err){ osmFail(err); }
}

function applyHash(){
  const m = (location.hash||'').match(/shop=([\w]+)/);
  if(!m) return;
  const id = m[1];
  const sh = ALL_PLACES().filter(x=>x.id===id)[0];
  if(!sh) return;
  state.sel = id;
  state.open.add(id);
  state.onlyOpen = false;          // 免得那家今天剛好吃不到就看不見
  state.showUnknown = true;
  state.dismissed.add('sample');
  render();
  const el = [].filter.call(document.querySelectorAll('#list .shop'),
    x=>x.querySelector('.nm') && x.querySelector('.nm').textContent.indexOf(sh.name)>=0)[0];
  if(el) el.scrollIntoView({block:'center'});
  const host = document.getElementById('banners');
  if(host){
    const d = document.createElement('div');
    d.className = 'banner';
    d.style.background = 'var(--accentbg)'; d.style.color = 'var(--accent)';
    d.innerHTML = '🔗 有人分享了 <b>' + esc(sh.name) + '</b> 給你。'
      + '（已暫時關掉「只看吃得到的」，免得今天剛好沒開就找不到）';
    host.insertBefore(d, host.firstChild);
  }
}

/* 手機上提示條收成 3 行（三條加起來比內容還高），點一下展開。
   .clip 只加在真的被截掉的那幾條上,沒被截的不要出現「點開」。 */
function clipBanners(){
  if(!matchMedia('(max-width:600px)').matches) return;
  const host = document.getElementById('banners');
  if(!host) return;
  [].forEach.call(host.children, el => {
    if(el.classList.contains('exp')) return;
    el.classList.toggle('clip', el.scrollHeight > el.clientHeight + 2);
  });
}
document.getElementById('banners').addEventListener('click', e => {
  if(!matchMedia('(max-width:600px)').matches) return;
  if(e.target.closest('.bclose') || e.target.closest('button') ||
     e.target.closest('a')) return;         /* 關閉鈕和連結照原本的走 */
  const b = e.target.closest('.banner');
  if(b) b.classList.toggle('exp');
});

/* 手機：把 header 黏住，只留星期分頁在畫面上。
   負偏移 = 標題那一行的高度（會隨換行變動，所以每次都量）。 */
function stickyTabs(){
  const h = document.querySelector('header');
  const row = h && h.querySelector('.hrow');
  if(!h || !row) return;
  if(!matchMedia('(max-width:600px)').matches){ h.style.top = ''; return; }
  h.style.top = '-' + Math.round(row.getBoundingClientRect().height) + 'px';
}
window.addEventListener('resize', stickyTabs);

<script>
/* ==========================================================================
   共享層 —— 評分／菜單／回報／菜單照片
   --------------------------------------------------------------------------
   這是 classic artifact（有版本),不是 live doc。判斷依據：發布後抓下來的
   HTML 裡,伺服器沒有幫任何元素蓋 data-id,所以 live doc 的 edit() 沒有
   target 可以指。能用的是 publish()。

   用 publish 的「files 形式」：
     data/shared.json   評分、菜單、回報、照片索引
     photos/<id>-<t>.jpg 菜單照片（真的檔案,所以照片也能共享）
   沒點到名的路徑會原封不動帶過去,而且成功之後只有「別人的 view」會重載,
   自己這個 view 繼續跑。

   兩個限制（不是 bug,是機制）：
     1. publish 之後,這個 view 的相對網址還是指向它載入的那一版 ——
        剛上傳的照片自己這邊讀不到檔案,所以先用手上的 dataURL 顯示。
     2. 同樣的原因,衝突時沒辦法在這個 view 重讀新版資料 —— 只能重新載入。
   ========================================================================== */
(function(){
  var AF = null, MODE = 'local', NOTE = '', BUSY = false;
  var DATA = 'data/shared.json';
  var S = { v:1, ratings:{}, menus:{}, reports:{}, photos:{} };
  var FRESH = {};   /* 這個 session 剛上傳的照片：路徑 -> dataURL */

  function clean(x){ return String(x||'').replace(/[|:]/g,'').trim().slice(0,10) || '訪客'; }
  function esc2(x){ return String(x||'').replace(/[&<>]/g, function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':'&gt;'; }); }

  function normalize(o){
    o = (o && typeof o==='object') ? o : {};
    var pick = function(k){ return (o[k] && typeof o[k]==='object') ? o[k] : {}; };
    return { v:1, ratings:pick('ratings'), menus:pick('menus'),
             reports:pick('reports'), photos:pick('photos') };
  }

  function load(){
    return fetch(DATA, {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j) S = normalize(j); })
      .catch(function(){});   /* 還沒有人寫過 -> 404,當空的 */
  }

  function writeErr(err){
    var c = (err && err.code) || '';
    if(c==='not_writer' || c==='not_granted' || c==='capability_disabled'){
      MODE='readonly'; NOTE='你是唯讀檢視 —— 看得到大家的評分、菜單和照片,但不能改。';
    } else if(c==='conflict'){
      NOTE='有人同時在改,畫面要重新載入才看得到最新的 —— 重整後請再按一次。';
      setTimeout(function(){ try{ location.reload(); }catch(e){} }, 1600);
    } else if(c==='too_large'){
      NOTE='存不下了 —— 照片太多,先刪掉幾張共享照片。';
    } else if(c==='rate_limited'){
      NOTE='太快了,等幾秒再試。';
    } else {
      NOTE='沒存上去（'+(c||'連線問題')+'）,再試一次。';
    }
    render();
  }

  /* 所有寫入都走這裡。mutate() 是「把我的改動套到現在的 S 上」,
     所以就算重試也只會套一次該套的東西。 */
  function commit(mutate, files){
    if(MODE==='readonly') return Promise.reject({code:'not_writer'});
    if(!AF || typeof AF.publish!=='function') return Promise.reject({code:'not_declared'});
    if(BUSY) return Promise.reject({code:'rate_limited'});
    BUSY = true; NOTE = '';
    mutate();
    render();                                   /* 先樂觀更新畫面 */
    var payload = {};
    payload[DATA] = JSON.stringify(S);
    if(files) Object.keys(files).forEach(function(k){ payload[k] = files[k]; });
    return AF.publish(payload)
      .then(function(){ BUSY=false; MODE='shared'; render(); })
      .catch(function(err){ BUSY=false; writeErr(err); throw err; });
  }

  /* ---- 評分 ---- */
  window.scoreOf = function(id){
    var map = (MODE==='local') ? (ud.ratings[id]||{}) : (S.ratings[id]||{});
    var vals = Object.keys(map).map(function(k){return map[k];})
                 .filter(function(v){return v>0;});
    if(!vals.length) return {avg:0, n:0, who:map};
    var sum = vals.reduce(function(a,b){return a+b;},0);
    return {avg:sum/vals.length, n:vals.length, who:map};
  };
  window.rate = function(id, n){
    var me = clean(ud.me);
    if(MODE==='local'){
      ud.ratings[id] = ud.ratings[id] || {};
      if(n>0) ud.ratings[id][me]=n; else delete ud.ratings[id][me];
      save(); render(); return;
    }
    commit(function(){
      S.ratings[id] = S.ratings[id] || {};
      if(n>0) S.ratings[id][me] = n; else delete S.ratings[id][me];
    }).then(function(){ toast(n>0 ? '評分已存,大家都看得到' : '已取消評分'); },
            function(){});
  };

  /* ---- 錯誤回報 ---- */
  window.getReports = function(id){
    return (MODE==='local' ? (ud.reports && ud.reports[id]) : S.reports[id]) || [];
  };
  window.addReport = function(id, rep){
    if(MODE==='local'){
      ud.reports[id] = (ud.reports[id]||[]).concat([rep]); save(); render(); return;
    }
    commit(function(){ S.reports[id] = (S.reports[id]||[]).concat([rep]); })
      .then(function(){ toast('回報已送出,大家都看得到'); }, function(){});
  };
  window.resolveReport = function(id, idx){
    if(MODE==='local'){
      var l=(ud.reports[id]||[]).slice();
      if(l[idx]){ l[idx]=Object.assign({},l[idx],{done:!l[idx].done}); ud.reports[id]=l;
                  save(); render(); }
      return;
    }
    commit(function(){
      var l=(S.reports[id]||[]).slice();
      if(l[idx]) l[idx]=Object.assign({},l[idx],{done:!l[idx].done});
      S.reports[id]=l;
    }).catch(function(){});
  };

  /* ---- 菜單 ---- */
  var _getMenu = window.getMenu;
  window.getMenu = function(id){
    if(MODE!=='local'){
      var v = S.menus[id];
      if(v) return v;
    }
    return _getMenu ? _getMenu(id) : '';
  };
  window.setMenu = function(id, text){
    if(MODE==='local'){ ud.menus[id]=text; save(); render(); return; }
    commit(function(){
      if(text) S.menus[id]=text; else delete S.menus[id];
    }).then(function(){ toast('菜單已存,同事都看得到了'); }, function(){});
  };

  /* ---- 菜單照片（真的檔案）---- */
  window.canShare = function(){ return MODE==='shared' || MODE==='maybe'; };

  window.sharedPhotos = function(id){
    if(MODE==='local') return [];
    return (S.photos[id]||[]).map(function(p){
      return { u: FRESH[p.f] || p.f, who: p.who || '匿名', d: p.d || '',
               kb: p.kb || 0, key: p.f };
    });
  };

  function dataToBlob(u){
    var i = u.indexOf(',');
    var bin = atob(u.slice(i+1));
    var arr = new Uint8Array(bin.length);
    for(var j=0;j<bin.length;j++) arr[j] = bin.charCodeAt(j);
    return new Blob([arr], {type:'image/jpeg'});
  }

  window.pushSharedPhoto = function(id, p){
    if(MODE==='local') return Promise.reject({code:'not_declared'});
    var path = 'photos/' + id + '-' + Date.now() + '.jpg';
    var files = {};
    files[path] = dataToBlob(p.u);
    FRESH[path] = p.u;              /* 自己這個 view 讀不到新版檔案,先用手上這張 */
    return commit(function(){
      S.photos[id] = (S.photos[id]||[]).concat(
        [{ f:path, who:p.who||'匿名', d:p.d||'', kb:p.kb||0 }]);
    }, files);
  };

  window.dropSharedPhoto = function(id, key){
    if(MODE==='local') return Promise.reject({code:'not_declared'});
    var files = {};
    files[key] = null;              /* null = 刪掉這個路徑 */
    return commit(function(){
      S.photos[id] = (S.photos[id]||[]).filter(function(p){ return p.f !== key; });
      if(!S.photos[id].length) delete S.photos[id];
    }, files);
  };

  /* ---- 匯出：重新發布之前先把大家累積的資料撈出來 ----
     為什麼需要這個：data/shared.json 只有在 Artifact 裡面讀得到,
     桌面那邊看不到。要重新發布（改店家資料、改功能）之前先按這個複製,
     否則有可能把大家累積的東西蓋掉。 */
  function exportModal(){
    var m = document.getElementById('modal');
    m.innerHTML = '<h2>匯出大家的共享資料</h2>' +
      '<p>複製下面整段。<b>要重新發布這個 app 之前先做這件事</b> —— ' +
      '共享資料存在 Artifact 裡面,桌面那邊讀不到,重新發布有可能蓋掉。</p>';
    var ta = document.createElement('textarea');
    ta.value = JSON.stringify(S, null, 1);
    m.appendChild(ta);
    var row = document.createElement('div');
    row.className='crow'; row.style.marginTop='9px';
    var cp = btn('複製', function(){
      ta.select();
      if(navigator.clipboard) navigator.clipboard.writeText(ta.value)
        .then(function(){ toast('已複製'); }, function(){});
      else document.execCommand('copy');
    });
    cp.className='btn pri'; row.appendChild(cp);
    row.appendChild(btn('關閉', function(){
      document.getElementById('mask').classList.remove('on'); }));
    m.appendChild(row);
    document.getElementById('mask').classList.add('on');
  }

  /* ---- 狀態提示 ---- */
  function banner(){
    var host = document.getElementById('banners'); if(!host) return;
    var d = document.createElement('div');
    if(NOTE && MODE!=='readonly'){
      d.className='banner err'; d.textContent='⚠️ '+NOTE;
    } else if(MODE==='readonly'){
      d.className='banner sample'; d.textContent='👀 '+NOTE;
    } else if(MODE==='local'){
      d.className='banner sample';
      d.innerHTML='ℹ️ <b>本機模式</b>：評分／菜單／照片只存在你自己的瀏覽器。'+
        '要讓同事一起維護,請開分享出去的那個 Artifact 連結。';
    } else {
      var ppl={};
      Object.keys(S.ratings).forEach(function(k){
        Object.keys(S.ratings[k]||{}).forEach(function(w){ ppl[w]=1; }); });
      var names = Object.keys(ppl);
      var nPhoto = 0, nMenu = Object.keys(S.menus).length;
      Object.keys(S.photos).forEach(function(k){ nPhoto += (S.photos[k]||[]).length; });
      d.className='banner'; d.style.background='var(--okbg)'; d.style.color='var(--ok)';
      d.innerHTML='✅ <b>共享模式</b> —— 你以「<b>'+esc2(ud.me||'訪客')+
        '</b>」的身分評分（右上角可以改名字）。'+
        '評分、菜單、菜單照片、錯誤回報都是大家共用的。'+
        (names.length ? '　目前 '+names.length+' 個人評過：'+
           names.map(esc2).join('、') : '　還沒有人評分,點星星開始。')+
        (nMenu ? '　菜單 '+nMenu+' 家' : '')+
        (nPhoto ? '　照片 '+nPhoto+' 張' : '');
      var ex = document.createElement('button');
      ex.className='btn ghost'; ex.textContent='匯出資料';
      ex.style.flex='0 0 auto'; ex.onclick=exportModal;
      d.appendChild(ex);
    }
    if(d.className) host.appendChild(d);

    /* 為什麼這裡沒有地圖：Artifact 的 CSP 只放行 Google Fonts,
       Leaflet 與 OpenStreetMap 圖磚都載不到,所以共享版是純清單。 */
    var m=document.createElement('div');
    m.className='banner'; m.style.color='var(--dim)';
    m.innerHTML='這個共享版沒有地圖（Artifact 不允許載入外部圖磚）。'+
      '要看地圖、或從 OpenStreetMap 匯入店家與停車場,用本機的 <b>index.html</b>。';
    host.appendChild(m);
  }
  var _render = window.render;
  window.render = function(){ _render(); banner(); };

  /* ---- 啟動 ---- */
  if(window.claude && typeof claude.use === 'function'){
    claude.use('artifact').then(function(cap){
      AF = cap;
      /* 'maybe' = 是 Artifact,但還沒真的寫過,不知道有沒有寫入權。
         第一次寫成功變 'shared',被拒變 'readonly'。 */
      MODE = (AF && typeof AF.publish === 'function') ? 'maybe' : 'local';
      return load();
    }, function(){ MODE='local'; })
     .then(function(){ if(MODE==='maybe') MODE='shared'; render(); },
           function(){ render(); });
  } else {
    render();
  }
})();
</script>
</body>
</html>
